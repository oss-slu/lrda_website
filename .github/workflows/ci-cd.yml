name: CI/CD Pipeline

permissions:
  contents: read

on:
  pull_request:
    branches: [301-improve-admin]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit --silent --no-coverage
        env:
          VITE_API_URL: 'http://localhost:3002'
          VITE_OPENAI_API_KEY: 'mock-openai-key'
          VITE_OPENAI_API_URL: 'https://api.openai.com/v1'
          CI: 'true'
          SUPPRESS_CONSOLE: 'true'

  # E2E tests require a running API server + database, which CI doesn't have.
  # The test setup uses Vitest + Playwright (not @playwright/test), so
  # `playwright test --project=chromium` was never correct.
  # TODO: Set up CI with docker-compose for API + PostgreSQL, then re-enable
  #       using: pnpm --filter web test:e2e
