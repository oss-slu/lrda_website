name: CI/CD Pipeline

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests with coverage
        id: tests
        run: pnpm --filter web test:unit --coverage --silent
        env:
          VITE_API_URL: 'http://localhost:3002'
          CI: 'true'
          SUPPRESS_CONSOLE: 'true'

      - name: Upload web coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: packages/web/coverage/
          if-no-files-found: error

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start test database
        run: |
          DB_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$DB_PASSWORD"
          DATABASE_URL="postgresql://lrda:$DB_PASSWORD@localhost:5433/lrda_api"
          echo "::add-mask::$DATABASE_URL"
          export POSTGRES_USER=lrda
          export POSTGRES_PASSWORD="$DB_PASSWORD"
          export POSTGRES_DB=lrda_api
          docker run --detach --rm --name coverage-postgres \
            --env POSTGRES_USER --env POSTGRES_PASSWORD --env POSTGRES_DB \
            --publish 127.0.0.1:5433:5432 \
            --health-cmd "pg_isready -h 127.0.0.1 -U lrda -d lrda_api" \
            --health-interval 1s --health-timeout 5s --health-retries 30 \
            postgres:17-alpine
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' coverage-postgres)" = healthy ]; then
              echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs coverage-postgres
          exit 1

      - name: Create test database schema
        run: pnpm --filter @lrda/api db:push

      - name: Run API tests with coverage
        id: tests
        run: pnpm --filter @lrda/api test:run --coverage --silent
        env:
          CI: 'true'

      - name: Upload API coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: packages/api/coverage/
          if-no-files-found: error

      - name: Stop test database
        if: ${{ always() }}
        run: |
          if docker container inspect coverage-postgres > /dev/null 2>&1; then
            docker rm --force --volumes coverage-postgres
          fi

  # E2E tests require a running API server + database, which CI doesn't have.
  # The test setup uses Vitest + Playwright (not @playwright/test), so
  # `playwright test --project=chromium` was never correct.
  # TODO: Set up CI with docker-compose for API + PostgreSQL, then re-enable
  #       using: pnpm --filter web test:e2e
