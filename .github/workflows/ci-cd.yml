name: CI/CD Pipeline

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests with coverage
        id: tests
        run: pnpm --filter web test:unit --coverage --silent
        env:
          VITE_API_URL: 'http://localhost:3002'
          CI: 'true'
          SUPPRESS_CONSOLE: 'true'

      - name: Upload web coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: packages/web/coverage/
          if-no-files-found: error

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lrda
          POSTGRES_PASSWORD: lrda_dev
          POSTGRES_DB: lrda_api
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lrda -d lrda_api"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database schema
        run: pnpm --filter @lrda/api db:push
        env:
          DATABASE_URL: 'postgresql://lrda:lrda_dev@localhost:5433/lrda_api'

      - name: Run API tests with coverage
        id: tests
        run: pnpm --filter @lrda/api test:run --coverage --silent
        env:
          CI: 'true'

      - name: Upload API coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: packages/api/coverage/
          if-no-files-found: error

  # E2E tests require a running API server + database, which CI doesn't have.
  # The test setup uses Vitest + Playwright (not @playwright/test), so
  # `playwright test --project=chromium` was never correct.
  # TODO: Set up CI with docker-compose for API + PostgreSQL, then re-enable
  #       using: pnpm --filter web test:e2e
