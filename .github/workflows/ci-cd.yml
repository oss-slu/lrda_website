name: CI/CD Pipeline

permissions:
  contents: read

on:
  pull_request:
    branches: [301-improve-admin]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit --silent --no-coverage
        env:
          VITE_API_URL: 'http://localhost:3002'
          VITE_OPENAI_API_KEY: 'mock-openai-key'
          VITE_OPENAI_API_URL: 'https://api.openai.com/v1'
          CI: 'true'
          SUPPRESS_CONSOLE: 'true'

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm --filter web exec playwright test --project=chromium
        env:
          CI: 'true'
          VITE_API_URL: 'http://localhost:3002'
          VITE_OPENAI_API_KEY: 'ci-mock-openai-key'
          VITE_OPENAI_API_URL: 'https://api.openai.com/v1/chat/completions'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          retention-days: 30
